# Her main/master yüklemesinde: testleri çalıştır, dist/ paketini üret, GitHub Pages'e yayınla.
name: Test ve GitHub Pages yayını

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Birim testleri
        run: npm test

      - name: Statik denetim
        run: npm run audit

      - name: Yayın paketini üret
        run: python tools/build_dist.py

      - name: Paketi denetle
        run: node tools/audit.js dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
